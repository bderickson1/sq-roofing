# Netlify configuration — SQ Roofing (Next.js 16 App Router)

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Send www to the apex domain so there is one canonical host for SEO.
# Netlify serves HTTPS on both once the certificate is issued.
[[redirects]]
  from = "https://www.sqroofingd.com/*"
  to = "https://sqroofingd.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed build assets never change; cache them hard.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
